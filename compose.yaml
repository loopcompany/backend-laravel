services:
  app:
    build:
      context: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      USER_PANEL_URL: http://localhost:8000/user/login
      TECHNICIAN_PANEL_URL: http://localhost:8000/technician/login
      TECHNICIAN_REGISTER_URL: http://localhost:8000/technician/register
      LOG_CHANNEL: stderr_json
      LOG_LEVEL: info
      LOG_REQUESTS: "true"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
    volumes:
      - laravel-database:/var/www/html/database
      - laravel-storage:/var/www/html/storage
      # Windows installers live on the host (too big for git/the image)
      - ./public/downloads/windows:/var/www/html/public/downloads/windows:ro
    restart: unless-stopped

volumes:
  laravel-database:
  laravel-storage:
