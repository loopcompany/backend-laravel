services:
  app:
    build:
      context: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      LOG_CHANNEL: stderr
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
    volumes:
      - laravel-database:/var/www/html/database
      - laravel-storage:/var/www/html/storage
    restart: unless-stopped

volumes:
  laravel-database:
  laravel-storage:
